name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Verify tag and project version
        shell: bash
        run: |
          release_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ "${GITHUB_REF_NAME}" != "v${release_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod_version ${release_version}" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${release_version}" >> "${GITHUB_ENV}"

      - name: Build release
        run: ./gradlew clean check build --stacktrace

      - name: Create checksum
        shell: bash
        run: |
          release_file="delvefold-1.21.1-${RELEASE_VERSION}.jar"
          cd build/libs
          sha256sum "${release_file}" > "${release_file}.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_jar="build/libs/delvefold-1.21.1-${RELEASE_VERSION}.jar"
          gh release create "${GITHUB_REF_NAME}" "${release_jar}" "${release_jar}.sha256" \
            --verify-tag --title "Delvefold ${RELEASE_VERSION}" --generate-notes
