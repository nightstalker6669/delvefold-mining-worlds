name: Build

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build and verify
        run: ./gradlew clean check build --stacktrace

      - name: Record checksum
        run: sha256sum build/libs/delvefold-1.21.1-*.jar

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delvefold-${{ github.sha }}
          path: |
            build/libs/delvefold-1.21.1-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14

  game-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run NeoForge GameTests
        run: ./gradlew runGameTestServer --stacktrace

  dedicated-server-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Start dedicated server
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout 90s ./gradlew runServer --stacktrace > dedicated-server.log 2>&1
          status=$?
          set -e
          cat dedicated-server.log
          grep -q "DedicatedServer.*Done (" dedicated-server.log
          if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
            exit "$status"
          fi

  recipe-viewer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        task:
          - runClient
          - runClientJei
          - runClientEmi
          - runClientRecipeViewers
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install --yes xvfb xauth

      - name: Start recipe-viewer client
        shell: bash
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          set +e
          timeout 120s xvfb-run -a ./gradlew ${{ matrix.task }} --stacktrace > recipe-viewer.log 2>&1
          status=$?
          set -e
          cat recipe-viewer.log
          grep -q "Delvefold: Mining Worlds" recipe-viewer.log
          grep -q "Minecraft]: Setting user" recipe-viewer.log
          case "${{ matrix.task }}" in
            runClient)
              if grep -q "Just Enough Items" recipe-viewer.log || grep -q $'\t\tEMI ' recipe-viewer.log; then
                echo "Base client unexpectedly loaded a recipe viewer" >&2
                exit 1
              fi
              ;;
            runClientJei)
              grep -q "Just Enough Items" recipe-viewer.log
              if grep -q $'\t\tEMI ' recipe-viewer.log; then
                echo "JEI-only client unexpectedly loaded EMI" >&2
                exit 1
              fi
              ;;
            runClientEmi)
              grep -q $'\t\tEMI ' recipe-viewer.log
              if grep -q "Just Enough Items" recipe-viewer.log; then
                echo "EMI-only client unexpectedly loaded JEI" >&2
                exit 1
              fi
              ;;
            runClientRecipeViewers)
              grep -q "Just Enough Items" recipe-viewer.log
              grep -q $'\t\tEMI ' recipe-viewer.log
              ;;
          esac
          if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
            exit "$status"
          fi
